[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "youtube-video-translator"
version = "0.1.0"
description = "YouTube video translator and AI video dubbing CLI: translate any YouTube video or local file into another language with each speaker's cloned voice, a dubbed MP4/MP3 and translated SRT subtitles. One command, no GPU."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RTY2345RR" }]
keywords = [
  "youtube-video-translator", "video-translator", "translate-youtube-video", "ai-video-dubbing", "ai-dubbing",
  "video-dubbing", "video-translation", "voice-cloning", "subtitles", "srt", "yt-dlp", "multi-speaker",
  "pyvideotrans-alternative", "videolingo-alternative", "llm-translation", "miragea",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["httpx>=0.27", "yt-dlp>=2025.1.1", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "build", "twine"]

[project.urls]
Homepage = "https://github.com/RTY2345RR/youtube-video-translator"
Demo = "https://huggingface.co/spaces/miragea/youtube-video-translator"
Repository = "https://github.com/RTY2345RR/youtube-video-translator"
Documentation = "https://github.com/RTY2345RR/youtube-video-translator#readme"
Issues = "https://github.com/RTY2345RR/youtube-video-translator/issues"
Changelog = "https://github.com/RTY2345RR/youtube-video-translator/blob/main/CHANGELOG.md"
"Voice engine" = "https://miragea.ai"

[project.scripts]
youtube-video-translator = "youtube_video_translator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_video_translator"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "docs/", "README.md", "LICENSE", "CREDITS.md", "CHANGELOG.md", "llms.txt", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
